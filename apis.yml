aid: ceibo
name: Ceibo
description: Ceibo is a Chilean copper technology company accelerating access to copper supply through
  a proprietary leaching process that recovers copper from primary sulfide ores. Backed by Khosla Ventures
  and BHP Ventures, the company positions its on-site technology as faster than bioleaching, using less
  water than concentration and a fraction of the capital expenditure of concentrators, aiming to close
  the global copper supply-demand gap needed for the energy transition. Headquartered in Santiago, Chile,
  Ceibo was named a 2026 Fast Company World Changing Ideas winner. This is a company profile in the API
  Evangelist network; Ceibo publishes no public developer/API surface at this time.
